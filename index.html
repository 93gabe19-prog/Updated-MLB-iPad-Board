<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>93gabe19 Breaks!</title><style>
*{box-sizing:border-box}
:root{--navy:#061326;--gold:#d8b15d;--red:#bd2932;--paper:#f8f0df;--ink:#081a31}
html,body{margin:0;background:#020811;color:white;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;background:radial-gradient(ellipse at 50% 5%,#345b7d 0,#173956 22%,#0a1d33 50%,#020811 100%);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;background:
radial-gradient(circle at 6% 5%,#fff 0 2px,transparent 3px 24px,#fff 25px 27px,transparent 28px),
radial-gradient(circle at 94% 5%,#fff 0 2px,transparent 3px 24px,#fff 25px 27px,transparent 28px),
linear-gradient(90deg,transparent 7%,#ffffff12 7.2%,transparent 7.4% 92.6%,#ffffff12 92.8%,transparent 93%)}
.app{max-width:1200px;margin:auto;padding:7px;position:relative;z-index:1}
.header{height:108px;border:2px solid var(--gold);border-radius:14px;background:linear-gradient(105deg,#020914,#102f50 46%,#051325);display:flex;align-items:center;justify-content:space-between;padding:7px 14px;position:relative;overflow:hidden;box-shadow:0 8px 20px #000c,inset 0 0 0 1px #fff2}
.header:before{content:"";position:absolute;inset:4px;border:1px solid #f0d08366;border-radius:10px}
.header:after{content:"";position:absolute;width:700px;height:170px;left:24%;top:-115px;border-radius:50%;border:2px solid #e2bd7028;box-shadow:0 0 0 22px #e2bd7008,0 0 0 44px #e2bd7005}
.brand{display:flex;align-items:center;gap:14px;z-index:2}
.brand-logo{width:86px;height:86px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);box-shadow:0 4px 13px #000d}
.title{font-size:34px;font-weight:1000;line-height:.9;letter-spacing:.025em;text-shadow:3px 3px #000,0 0 15px #fff2}
.title .red{color:#d72c35}
.sub{font-size:9px;font-weight:1000;letter-spacing:.32em;color:#f0d58f;margin-top:9px}
.score-area{display:flex;align-items:center;gap:8px;z-index:2}
.score{width:94px;height:61px;border:2px solid #ad873f;border-radius:8px;background:#020811;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 0 13px #000,0 3px 7px #000a}
.score label{font-size:8px;font-weight:1000;letter-spacing:.15em;color:#ddd}
.score b{font:1000 25px/1 "Courier New",monospace;color:#32ef89;text-shadow:0 0 8px #32ef8999}
.score.taken-score b{color:#ff3842;text-shadow:0 0 8px #ff384299}
.reset{height:35px;border:1px solid var(--gold);border-radius:6px;background:linear-gradient(#214363,#091b30);color:white;font-size:9px;font-weight:1000;padding:0 12px}
section{margin-top:5px}
.division{height:29px;position:relative;margin:0 auto -1px;max-width:400px;background:linear-gradient(#244a6c,#07172b 60%,#0b2139);border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;gap:14px;clip-path:polygon(5% 0,95% 0,100% 50%,95% 100%,5% 100%,0 50%);box-shadow:0 5px 9px #000b;z-index:3}
.division b{font-size:13px;letter-spacing:.23em;text-shadow:2px 2px #000}
.division span{font-size:8px;color:var(--red);text-shadow:0 1px #000}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.team{height:104px;border:0;background:transparent;padding:0;cursor:pointer}
.team-card{height:100%;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(145deg,#fffefa,#e9ddc8);border:2px solid #b38d48;clip-path:polygon(2% 0,98% 0,100% 8%,100% 92%,98% 100%,2% 100%,0 92%,0 8%);box-shadow:0 5px 9px #000b,inset 0 0 0 1px #fff;overflow:hidden;color:var(--ink)}
.team-card:before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:repeating-linear-gradient(90deg,var(--red) 0 8px,transparent 8px 14px)}
.team-card:after{content:"";position:absolute;right:-35px;bottom:-65px;width:145px;height:145px;border:1px solid #17314d20;border-radius:50%;box-shadow:0 0 0 16px #17314d06,0 0 0 32px #17314d04}
.logo{height:62px;width:85px;display:flex;align-items:center;justify-content:center;z-index:1}
.logo img{width:64px;height:64px;object-fit:contain;filter:drop-shadow(0 3px 2px #0005)}
.city{font-size:8px;font-weight:950;letter-spacing:.1em;color:#68655e;z-index:1;line-height:1.05;margin-top:2px}
.name{font-size:13px;font-weight:1000;letter-spacing:.025em;z-index:1;line-height:1.05;margin-top:3px;text-shadow:0 1px #fff8}
.taken{display:none;position:absolute;top:5px;right:5px;background:var(--red);border:1px solid #7d151d;border-radius:4px;color:white;padding:3px 6px;font-size:7px;font-weight:1000;letter-spacing:.1em;z-index:4}
.team.taken-state .team-card{background:linear-gradient(145deg,#183a5c,#061528);color:white;border-color:var(--gold);box-shadow:0 5px 10px #000d,inset 0 0 20px #0008}
.team.taken-state .logo img{opacity:.25;filter:grayscale(1)}
.team.taken-state .city{color:#c9d0d7}
.team.taken-state .taken{display:block}
.footer{height:18px;display:flex;justify-content:center;align-items:center;gap:15px;font-size:8px;font-weight:900;color:#ddd}
.dot{display:inline-block;width:8px;height:8px;background:var(--paper);border:1px solid #bcae94;margin-right:3px;vertical-align:-1px;border-radius:2px}.dot.r{background:var(--red);border-color:var(--red)}
@media(max-width:850px) and (orientation:portrait){
.header{height:76px}.brand-logo{width:52px;height:52px}.title{font-size:18px}.sub{font-size:6px}.score{width:57px;height:45px}.score b{font-size:16px}.score label{font-size:6px}.reset{height:29px;padding:0 7px}.division{height:23px;max-width:270px}.division b{font-size:10px}.team{height:78px}.logo{height:44px;width:52px}.logo img{width:43px;height:43px}.city{font-size:6px}.name{font-size:9px}
}
